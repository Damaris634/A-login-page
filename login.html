<!--Create a login form of  your choice and style it using bootstrap-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form </title>

    <link rel="stylesheet" href="bootsrap/css/bootstrap.min.css">
    <script src="bootsrap/js/bootstrap.min.js"></script>
   
    
</head>
<body> 

    

   
    
    <form action=""  >

        <style>
            body{
                background-image: url(images/hotelbg.png);
            }
        </style>

        <div class="container p-4 mx-auto m-5  w-50">

       <div class="bg-success">

        <h1 class="text-sm-center">Tash Accomodation Login</h1> 

       <div class="text-center mb-1">
        <img src="images/icon.png" alt=""
        width="100"  height="100"
        class="rounded-circle">
        

        </div>

         <br><br>

        </div>

        <div class="bg-light">


        <p class="fw-bold">Welcome esteemed customer</p>
        <p class="fw-lighter">please enter your sign in information</p>

        <label for="username" class="fw-bold">Username:</label>
        <input type="text" placeholder="Enter your username" id="username" required> <br><br>

        <label for="password" class="fw-bold">Password:</label>
        <input type="password" placeholder="Enter your password" id="password" required> <br><br>

        </div>

    

        <div class="container border p-3 bg-light">
        <div class="d-flex justify-content-between">

          
       
        <button class="btn btn-warning btn-sm ">Forgot password</button> 
           

        <button class="btn btn-success btn-sm ">sign in</button> 


        </div>

        
        
        
        </div>
      

       

        

          </div>


          </div>

        
        



    </form>
    
</body>
</html>
